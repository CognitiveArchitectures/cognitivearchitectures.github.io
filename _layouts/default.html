<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  {%- assign page_title = page.title | default: site.title -%}
  <title>{{ page_title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta name="author" content="{{ site.author }}">
  <meta name="theme-color" content="#FBFAF7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
  <!-- Icons -->
  <link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}">
  <link rel="icon" type="image/png" href="{{ '/apple-touch-icon.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">
  <!-- Open Graph (miniatura al compartir) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{{ page_title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/og-image.png?v=1' | absolute_url }}">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{ site.title }} — {{ site.tagline }}">
  <meta property="og:locale" content="en_US">
  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page_title }}">
  <meta name="twitter:description" content="{{ page.description | default: site.description }}">
  <meta name="twitter:image" content="{{ '/og-image.png?v=1' | absolute_url }}">
  {%- if site.twitter %}<meta name="twitter:site" content="@{{ site.twitter }}">{%- endif %}
  <!-- Type -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
  <style>
  :root{
    --bg:#FBFAF7; --ink:#1A1A17; --muted:#6E6A61; --hair:#E7E2D8;
    --accent:#3C5A46; --accent-soft:#557458; --card:#FFFFFF;
    --serif:"Newsreader", ui-serif, Georgia, "Times New Roman", serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#121110; --ink:#EEEBE2; --muted:#948F84; --hair:#292722;
           --accent:#8AB095; --accent-soft:#9DBFA6; --card:#1A1815; }
  }
  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--sans); font-size:16px; line-height:1.65;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  .serif{ font-family:var(--serif); }
  .wrap{ max-width:700px; margin:0 auto; padding:0 28px; }
  a{ color:var(--accent); text-decoration:none; transition:color .15s ease; }
  a:hover{ color:var(--accent-soft); }
  a:focus-visible, .card:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; border-radius:6px; }

  .eyebrow{ font-size:11.5px; letter-spacing:.16em; text-transform:uppercase;
            color:var(--muted); font-weight:600; margin:0 0 20px; }

  /* Header: marca a la izquierda, secciones a la derecha (en teléfono solo la marca) */
  header{ padding:46px 0 0; display:flex; align-items:center; justify-content:space-between; gap:20px; }
  header nav{ display:flex; gap:28px; }
  header nav a{ color:var(--muted); font-size:14.5px; font-weight:500; }
  header nav a:hover{ color:var(--ink); }
  @media (max-width:640px){ header nav{ display:none; } }
  @media (prefers-reduced-motion:no-preference){ html{ scroll-behavior:smooth; } }
  .brand{ display:inline-flex; align-items:center; gap:12px; }
  .mono{
    width:38px; height:38px; border-radius:10px; background:var(--ink);
    color:var(--bg); display:grid; place-items:center;
    font-weight:800; font-size:14px; letter-spacing:.03em; flex:0 0 auto;
  }
  .brand b{ font-size:15.5px; font-weight:600; letter-spacing:.004em; }
  /* El nombre se descubre de izquierda a derecha cuando aterriza el logo (script del index) */
  .brand b{ -webkit-clip-path:inset(-4px 0 -4px 0); clip-path:inset(-4px 0 -4px 0); }
  .brand.velado b{ -webkit-clip-path:inset(-4px 100% -4px 0); clip-path:inset(-4px 100% -4px 0); opacity:0; transform:translateX(-10px); }
  .brand.anima b{ transition:clip-path .75s cubic-bezier(.2,.7,.2,1), -webkit-clip-path .75s cubic-bezier(.2,.7,.2,1),
                  opacity .5s ease, transform .75s cubic-bezier(.2,.7,.2,1); }

  /* Hero */
  .hero{ padding:88px 0 78px; }
  .hero h1{
    font-family:var(--serif); font-optical-sizing:auto;
    font-size:clamp(35px,6.5vw,58px); line-height:1.06; font-weight:400;
    letter-spacing:-.015em; margin:0 0 22px; max-width:15ch;
  }
  .hero p{ font-size:clamp(17px,2.5vw,20px); color:var(--muted); max-width:42ch; margin:0; line-height:1.5; }
  /* La red que se junta en «CA»: arriba del texto en teléfono, a la derecha en computadora */
  .hero .red{ display:block; width:100%; height:180px; margin:0 0 34px; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  @media (max-width:899px){ .hero{ padding-top:44px; } }
  /* El vuelo de la «CA» al logo: lienzo encima de todo, solo mientras vuela */
  .vuelo{ position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:10; }

  /* Sections */
  section{ padding:54px 0; border-top:1px solid var(--hair); }
  h2{ font-family:var(--serif); font-optical-sizing:auto;
      font-size:clamp(23px,3.4vw,28px); font-weight:500; line-height:1.18;
      letter-spacing:-.01em; margin:0 0 12px; }
  .lead{ color:var(--muted); margin:0; max-width:54ch; font-size:16.5px; }

  /* How we work */
  .principles{ display:grid; gap:26px 36px; margin-top:4px; }
  @media(min-width:560px){ .principles{ grid-template-columns:1fr 1fr; } .principle.wide{ grid-column:1 / -1; } }
  .principle.wide p{ max-width:56ch; }
  .principle h3{ font-family:var(--serif); font-size:18px; font-weight:500;
                 letter-spacing:-.005em; margin:0 0 5px; }
  .principle p{ margin:0; color:var(--muted); font-size:15px; line-height:1.55; }

  /* Product card */
  .card{
    display:block; background:var(--card); border:1px solid var(--hair); border-radius:18px;
    padding:28px 28px 26px; margin-top:12px; color:inherit;
    transition:border-color .18s ease, transform .18s ease, box-shadow .18s ease;
  }
  .card:hover{ border-color:var(--accent); transform:translateY(-2px);
               box-shadow:0 12px 34px -20px rgba(0,0,0,.28); }
  .card .row{ display:flex; align-items:center; justify-content:space-between;
              gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  .card h3{ font-family:var(--serif); margin:0; font-size:22px; font-weight:500; letter-spacing:-.01em; }
  .card .name{ display:inline-flex; align-items:center; gap:12px; }
  .app-icon{ width:40px; height:40px; border-radius:9px; box-shadow:0 0 0 1px var(--hair); flex:none; }
  .tag{ font-size:11.5px; font-weight:600; letter-spacing:.02em; color:var(--accent);
        border:1px solid var(--hair); border-radius:100px; padding:4px 12px; white-space:nowrap; }
  .card .desc{ color:var(--muted); margin:0 0 18px; font-size:15.5px; }
  .card .go{ font-size:14.5px; font-weight:600; color:var(--accent);
             display:inline-flex; align-items:center; gap:7px; }
  .card .arrow{ transition:transform .18s ease; }
  .card:hover .arrow{ transform:translateX(3px); }

  /* Contact: correo y X en una fila; en teléfono, uno debajo del otro */
  .contact .links{ display:flex; flex-wrap:wrap; gap:8px 32px; font-size:16px; }
  .contact a{ font-weight:500; }
  .contact .nota{ flex-basis:100%; margin:0; font-size:14px; color:var(--muted); }
  @media (max-width:560px){ .contact .links{ flex-direction:column; gap:6px; } }

  /* Computadora: más ancho y cada sección en dos columnas (etiqueta | contenido) */
  @media (min-width:900px){
    .wrap{ max-width:1040px; padding:0 48px; }
    .hero{ padding:110px 0 96px; display:grid; grid-template-columns:minmax(0,1fr) 400px; column-gap:48px; align-items:center; }
    .hero .red{ grid-column:2; grid-row:1; height:330px; margin:0; }
    .hero .hero-text{ grid-column:1; grid-row:1; }
    section{ display:grid; grid-template-columns:200px minmax(0,1fr); column-gap:56px; }
    section > .eyebrow{ margin:0; padding-top:9px; }
    section .body > :first-child{ margin-top:0; }
  }

  /* Footer */
  footer{ padding:62px 0 74px; border-top:1px solid var(--hair);
          display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap; }
  footer .nature{ font-family:var(--serif); font-style:italic; font-size:19px; color:var(--ink); margin:0; }
  footer small{ color:var(--muted); font-size:12.5px; }
  footer .legal{ flex-basis:100%; margin-top:-8px; }
  </style>
</head>
<body>
{{ content }}
</body>
</html>
